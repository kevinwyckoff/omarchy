HOOKS=(base udev plymouth keyboard autodetect microcode modconf kms keymap consolefont block encrypt filesystems fsck btrfs-overlayfs)

# The proprietary NVIDIA driver does early KMS itself: nvidia.conf (written by
# install/hardware/nvidia.sh, sourced before this file) early-loads nvidia_drm
# with modeset=1. Keeping the kms hook on such a system makes autodetect pull
# in nouveau — and ~100 MB of its GSP firmware — for a driver that never runs.
# Drop kms only when nvidia_drm is early-loaded and NVIDIA owns every display
# controller. Hybrid systems keep kms: their iGPU still needs it for early
# KMS at the LUKS prompt. So does anything unexpected, like a PCI tree that
# cannot be read.
#
# This reads MODULES midway through mkinitcpio's drop-in sourcing, so a
# later-sorting drop-in that resets MODULES outright — surface_device_modules.conf
# does — would strip nvidia_drm after kms was already dropped. Every machine
# Omarchy writes such a file for carries an Intel iGPU, which keeps kms here
# through the scan below; keep it that way.
if [[ " ${MODULES[*]:-} " == *" nvidia_drm "* ]]; then
  _omarchy_nvidia_gpu=0
  _omarchy_other_gpu=0
  for _omarchy_pci in "${OMARCHY_PCI_DEVICES_PATH:-/sys/bus/pci/devices}"/*; do
    if [[ ! -r $_omarchy_pci/class || ! -r $_omarchy_pci/vendor ]]; then
      # An unreadable device could be another GPU. Inconclusive keeps kms.
      _omarchy_other_gpu=1
      continue
    fi
    [[ $(<"$_omarchy_pci/class") == "0x03"* ]] || continue
    if [[ $(<"$_omarchy_pci/vendor") == "0x10de" ]]; then
      _omarchy_nvidia_gpu=1
    else
      _omarchy_other_gpu=1
    fi
  done
  if ((_omarchy_nvidia_gpu && !_omarchy_other_gpu)); then
    _omarchy_hooks=()
    for _omarchy_hook in "${HOOKS[@]}"; do
      [[ $_omarchy_hook == "kms" ]] || _omarchy_hooks+=("$_omarchy_hook")
    done
    HOOKS=("${_omarchy_hooks[@]}")
  fi
  unset _omarchy_nvidia_gpu _omarchy_other_gpu _omarchy_pci _omarchy_hooks _omarchy_hook
fi

# Bundle vconsole.conf so Plymouth uses the configured keyboard layout at the
# LUKS prompt, but only when that layout types Latin letters. Passphrases are
# Latin characters, so bundling a Hebrew/Greek/Cyrillic/Arabic layout would
# make the correct passphrase untypeable and lock the user out.
#
# The exception is a vconsole.conf whose XKB lines are exactly the ones
# Omarchy's keyboard picker adds for its KEYMAP (omarchy_keyboard_xkb_settings
# in setup-form.sh), which it does only for the console keymaps systemd's
# kbd-model-map has no row for. That file goes in through the omarchy-vconsole
# hook, which leaves those lines out. Plymouth reads a KEYMAP without
# XKBLAYOUT through the console keymap the keymap hook loads: the one the
# passphrase was typed on in the installer and in first-boot setup. The
# picker's layout is for the desktop, and it can put other characters on the
# same keys (Shift+4 is $ on the no-latin1 console and ¤ in XKB's no, for one),
# so handing it to Plymouth could turn away the passphrase typed at install.
# XKB lines set any other way go in as before, and so does every file when
# the packaged setup-form.sh is missing or predates the helper. It is read
# from /usr/share/omarchy, not $OMARCHY_PATH, so rebuilding from a shell that
# points OMARCHY_PATH at a checkout can't change what the LUKS prompt reads.
# OMARCHY_SETUP_FORM is for tests.
#
# FILES are added to the image after every hook has run, so a drop-in that
# adds FILES+=(/etc/vconsole.conf) itself puts the whole file back over the
# hook's copy, XKB lines and all.
_omarchy_vconsole_conf="${OMARCHY_VCONSOLE_CONF:-/etc/vconsole.conf}"
_omarchy_setup_form="${OMARCHY_SETUP_FORM:-/usr/share/omarchy/install/provisioning/setup-form.sh}"
# shellcheck disable=SC1090 # the machine's vconsole.conf and Omarchy's setup form
if [[ -f $_omarchy_vconsole_conf ]]; then
  _omarchy_picker_xkb=""
  if [[ -r $_omarchy_setup_form ]]; then
    _omarchy_picker_xkb=$(
      unset KEYMAP
      . "$_omarchy_vconsole_conf"
      [[ -n ${KEYMAP:-} ]] || exit 0
      . "$_omarchy_setup_form"
      declare -F omarchy_keyboard_xkb_settings >/dev/null || exit 0
      omarchy_keyboard_xkb_settings "$KEYMAP"
    ) || _omarchy_picker_xkb=""
  fi

  # The same XKB pattern the omarchy-vconsole hook strips; keep the two alike.
  if [[ -n $_omarchy_picker_xkb &&
    $(sed -nE '/^[[:space:]]*XKB(LAYOUT|MODEL|VARIANT|OPTIONS)[[:space:]]*=/p' "$_omarchy_vconsole_conf") == "$_omarchy_picker_xkb" ]]; then
    HOOKS+=(omarchy-vconsole)
  else
    case $(XKBLAYOUT=; . "$_omarchy_vconsole_conf" && echo "${XKBLAYOUT%%,*}") in
      af | am | ara | bd | bg | by | et | ge | gr | il | in | iq | ir | kg | kh | kz | la | lk | mk | mm | mn | mv | np | rs | ru | sy | th | tj | ua) ;;
      *) FILES+=(/etc/vconsole.conf) ;;
    esac
  fi
fi
unset _omarchy_vconsole_conf _omarchy_setup_form _omarchy_picker_xkb
